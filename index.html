<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消えた歌をさがす掲示板</title>
<style>
  :root{
    --ink:#2a2a2a;
    --bg:#f5f4f0;
    --line:#d8d6cf;
    --accent:#6b5b4f;
    --muted:#8a8578;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    min-height:100vh;
    padding:40px 16px 64px;
  }
  .wrap{max-width:560px;margin:0 auto;}

  header{margin-bottom:28px;}
  h1{font-weight:700;font-size:19px;line-height:1.6;margin:0 0 6px;}
  header p{font-size:12.5px;color:var(--muted);margin:0;line-height:1.7;}

  .card{background:#fff;border:1px solid var(--line);padding:28px 24px;margin-bottom:20px;}

  .switch-code{font-size:11.5px;color:var(--muted);margin:-8px 0 20px;text-align:right;}
  .switch-code a{color:var(--accent);cursor:pointer;text-decoration:underline;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:12.5px;padding:9px 16px;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .toast.show{opacity:1;}

  .tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--line);}
  .tab{flex:1;background:none;border:none;font-weight:700;font-size:14.5px;padding:8px 6px 12px;color:var(--muted);cursor:pointer;position:relative;transition:color .2s ease;}
  .tab[aria-selected="true"]{color:var(--ink);}
  .tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);}

  .field{margin-bottom:18px;}
  .field.is-hidden{display:none;}
  .field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;transition:opacity .15s ease;}
  .field .hint{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:6px;}
  .field input[type=text],
  .field textarea{
    width:100%;font-family:inherit;font-size:16px;padding:9px 10px;
    background:#fff;border:1px solid var(--line);color:var(--ink);
  }
  .field input:focus,
  .field textarea:focus{outline:1px solid var(--accent);outline-offset:0;}
  .field textarea{resize:vertical;min-height:160px;line-height:1.6;}

  #linkField{
    transition:opacity .25s ease, max-height .3s ease, margin-bottom .3s ease;
    max-height:90px; overflow:hidden;
  }
  #linkField.is-hidden{
    display:block; opacity:0; max-height:0; margin-bottom:0; pointer-events:none;
  }

  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}

  .submit{
    width:100%;background:var(--accent);color:#fff;border:none;
    font-weight:700;font-size:14.5px;padding:12px;cursor:pointer;margin-top:4px;
    transition:opacity .2s ease, background .2s ease;
  }
  .submit:hover{opacity:.9;}
  .submit:disabled{background:var(--muted);cursor:default;}

  .note{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.7;}

  .done{text-align:center;padding:20px 10px 10px;}

  .done .stamp{
    display:inline-block;font-weight:700;font-size:14px;color:var(--accent);
    border:1px solid var(--accent);padding:6px 16px;margin-bottom:14px;
  }
  .done p{font-size:13.5px;line-height:1.8;color:#555;}

  .main-tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--line);}
  .main-tab{flex:1;background:none;border:none;font-weight:700;font-size:15px;padding:10px 6px 14px;color:var(--muted);cursor:pointer;position:relative;transition:color .2s ease;}
  .main-tab.active{color:var(--ink);}
  .main-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--accent);}

  /* ---- 画面切り替えの共通トランジション ---- */
  .view{transition:opacity .22s ease, transform .22s ease;}
  .view-hidden{opacity:0;}
  .view-out-left{transform:translateX(-14px);}
  .view-out-right{transform:translateX(14px);}
  .view-in-left{transform:translateX(14px);}
  .view-in-right{transform:translateX(-14px);}

  .history-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;
    transition:background .15s ease;
  }
  .history-item:active{background:#f7f6f2;}
  .history-item:last-child{border-bottom:none;}
  .history-item .main{min-width:0;}
  .history-item .subject{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px;}
  .history-item .preview{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .history-item .meta{font-size:10.5px;color:var(--muted);white-space:nowrap;margin-top:5px;}
  .history-item .chevron{color:var(--muted);font-size:14px;flex-shrink:0;}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:10px;margin-right:6px;}
  .badge.pending{background:#fbe9e5;color:#b5533c;}
  .badge.done{background:#e7f0e9;color:#4a7a5c;}
  .type-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:1px 7px;margin-right:6px;}

  .back-btn{
    background:none;border:none;color:var(--accent);font-weight:700;font-size:13px;
    padding:0 0 18px;cursor:pointer;
  }
  .detail-subject{font-size:15.5px;font-weight:700;margin-bottom:4px;}
  .detail-meta{font-size:11.5px;color:var(--muted);margin-bottom:18px;}

  .detail-block{border-left:2px solid var(--line);padding:2px 0 2px 14px;margin-bottom:16px;}
  .detail-block.reply{border-left-color:var(--accent);}
  .detail-block .who{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px;}
  .detail-block .body{font-size:13.5px;line-height:1.7;white-space:pre-wrap;}

  .follow-up{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}
  .follow-up textarea{
    width:100%;font-family:inherit;font-size:16px;padding:9px 10px;
    border:1px solid var(--line);min-height:80px;resize:vertical;margin-bottom:10px;
  }
  .follow-up textarea:focus{outline:1px solid var(--accent);outline-offset:0;}

  .empty-state{font-size:12.5px;color:var(--muted);text-align:center;padding:20px 0;}


  footer{text-align:center;font-size:11.5px;color:var(--muted);margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>情報提供・掲載依頼用フォーム</h1>
    <p>匿名のまま、あなたと個別にやり取りできます。「履歴」タブから、これまでの送信内容や運営からの返信を確認できます。</p>
  </header>

  <div class="main-tabs">
    <button class="main-tab active" data-section="submit">送信</button>
    <button class="main-tab" data-section="history">履歴</button>
  </div>

  <!-- ==================== 送信タブ ==================== -->
  <div id="submitSection" class="view">

    <p class="switch-code">別の端末でも続きを見たい場合は <a id="saveLinkBtn">このページの保存用リンクをコピー</a></p>

    <div class="card">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-type="情報提供">情報提供</button>
        <button class="tab" role="tab" aria-selected="false" data-type="掲載依頼">掲載依頼</button>
      </div>

      <form id="tipForm" class="view" novalidate>
        <div class="hp" aria-hidden="true">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <div class="field">
          <label for="subject" id="subjectLabel">件名</label>
          <input type="text" id="subject" required maxlength="200" placeholder="">
        </div>

        <div class="field">
          <label for="content" id="contentLabel">内容</label>
          <textarea id="content" required maxlength="3000" placeholder=""></textarea>
        </div>

        <div class="field" id="linkField">
          <label for="link">データ等のURL<span class="hint">任意</span></label>
          <input type="text" id="link" maxlength="500" placeholder="ギガファイル便、Googleドライブ等">
        </div>

        <div class="field">
          <label for="xid">XのID<span class="hint">任意</span></label>
          <input type="text" id="xid" maxlength="50" placeholder="@から始まるID">
        </div>

        <button type="submit" class="submit" id="submitBtn">送信する</button>
        <p class="note">送信内容は運営者本人のみが確認します。第三者には公開されません。</p>
      </form>

      <div class="done view" id="done" style="display:none;">
        <span class="stamp">送信済み</span>
        <p>送信が完了しました。<br>「履歴」タブに反映されるまで少し時間がかかることがあります。</p>
      </div>
    </div>
  </div>

  <!-- ==================== 履歴タブ ==================== -->
  <div id="historySection" class="view" style="display:none;">
    <div class="card">

      <!-- 一覧表示 -->
      <div id="historyListView" class="view">
        <div id="historyList">
          <p class="empty-state">まだ送信履歴はありません。</p>
        </div>
      </div>

      <!-- 詳細表示 -->
      <div id="historyDetailView" class="view" style="display:none;">
        <button type="button" class="back-btn" id="backBtn">← 一覧に戻る</button>
        <div id="historyDetailContent"></div>
      </div>

    </div>
  </div>

  <footer>やり取りの記録はこのブラウザにのみ保存されます。</footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
 * 設定値。GAS側を「ウェブアプリとしてデプロイ」した後に発行されるURLに置き換えてください。
 * (Apps Scriptエディタ→デプロイ→新しいデプロイ→種類:ウェブアプリ
 *  →実行ユーザー:自分、アクセスできるユーザー:全員 でデプロイして得られるURL)
 * ========================================================================= */
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzWxwdpFyQbukSDFPe25DtjNW3OBzbtyEVGrLsm-U3kS3naA_vQF-RnU2EyirJhmIKs/exec";
/* ========================================================================= */

const LS_CODE_KEY = 'tip_thread_code';

const form = document.getElementById('tipForm');
const done = document.getElementById('done');
const submitBtn = document.getElementById('submitBtn');
const tabs = document.querySelectorAll('.tab');
const subjectLabel = document.getElementById('subjectLabel');
const subjectInput = document.getElementById('subject');
const contentLabel = document.getElementById('contentLabel');
const contentInput = document.getElementById('content');
const linkField = document.getElementById('linkField');
const toast = document.getElementById('toast');
const historyList = document.getElementById('historyList');
const historyListView = document.getElementById('historyListView');
const historyDetailView = document.getElementById('historyDetailView');
const historyDetailContent = document.getElementById('historyDetailContent');

let currentType = '情報提供';
let historyRows = [];
let historyThreads = [];

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 2000);
}

/* ---------- 画面切り替え共通のフェード/スライド ---------- */
function switchView(hideEl, showEl, direction){
  // direction: 'forward'(次の画面へ進む) or 'back'(前の画面に戻る)
  const outClass = direction === 'back' ? 'view-out-right' : 'view-out-left';
  const inClass  = direction === 'back' ? 'view-in-left' : 'view-in-right';

  hideEl.classList.add('view-hidden', outClass);

  setTimeout(() => {
    hideEl.style.display = 'none';
    hideEl.classList.remove('view-hidden', outClass);

    showEl.style.display = '';
    showEl.classList.add('view-hidden', inClass);
    void showEl.offsetWidth; // reflow
    showEl.classList.remove('view-hidden', inClass);
  }, 180);
}

/* ---------- スレッドコードの発行・管理(裏側で自動、通常は非表示) ---------- */
function generateCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 紛らわしい文字(0/O, 1/I等)を除外
  let code = '';
  for(let i=0;i<8;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function getOrCreateThreadCode(){
  let code = localStorage.getItem(LS_CODE_KEY);
  if(!code){
    code = generateCode();
    localStorage.setItem(LS_CODE_KEY, code);
  }
  return code;
}

// URLに ?c=XXXXXXXX が付いている場合は、そのコードを復元して以後使用する
// (別端末で「保存用リンク」を開いたときのため)
const urlCode = new URLSearchParams(location.search).get('c');
if(urlCode && /^[A-Z0-9]{6,12}$/i.test(urlCode)){
  localStorage.setItem(LS_CODE_KEY, urlCode.toUpperCase());
  history.replaceState(null, '', location.pathname);
}

let threadCode = getOrCreateThreadCode();

document.getElementById('saveLinkBtn').addEventListener('click', () => {
  const url = `${location.origin}${location.pathname}?c=${threadCode}`;
  navigator.clipboard?.writeText(url).then(()=>{
    showToast('リンクをコピーしました。別端末でこのリンクを開いてください');
  }).catch(()=>{
    prompt('このURLをコピーしてください', url);
  });
});

/* ---------- メインタブ(送信/履歴)の切り替え ---------- */
const submitSection = document.getElementById('submitSection');
const historySection = document.getElementById('historySection');

document.querySelectorAll('.main-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    if(btn.classList.contains('active')) return;
    const isHistory = btn.dataset.section === 'history';
    document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    if(isHistory){
      switchView(submitSection, historySection, 'forward');
      showHistoryList(true);
      fetchThread();
    } else {
      switchView(historySection, submitSection, 'back');
    }
  });
});

/* ---------- 履歴の取得・一覧表示・詳細表示 ---------- */
async function fetchThread(){
  if(WEBAPP_URL.includes('【')) return; // 未設定の場合は何もしない
  try{
    const res = await fetch(`${WEBAPP_URL}?action=thread&code=${encodeURIComponent(threadCode)}&_=${Date.now()}`);
    historyRows = await res.json();
    renderHistoryList();
  }catch(e){
    console.error('履歴の取得に失敗しました', e);
  }
}

function groupThreads(rows){
  const map = new Map();
  rows.forEach((r, idx) => {
    const key = r.subject || '(件名なし)';
    if(!map.has(key)) map.set(key, { subject: r.subject, type: r.type, messages: [], lastIndex: idx });
    const t = map.get(key);
    t.messages.push(r);
    t.lastIndex = idx;
  });
  // 直近にやり取りがあったスレッドを上に
  return Array.from(map.values()).sort((a, b) => b.lastIndex - a.lastIndex);
}

function renderHistoryList(){
  historyThreads = groupThreads(historyRows);
  if(historyThreads.length === 0){
    historyList.innerHTML = '<p class="empty-state">まだ送信履歴はありません。</p>';
    return;
  }
  historyList.innerHTML = historyThreads.map((t, i) => {
    const last = t.messages[t.messages.length - 1];
    const status = last.status || '未対応';
    const badgeClass = status === '対応済み' ? 'done' : 'pending';
    const preview = (last.reply || last.content || '').replace(/\s+/g, ' ').trim();
    const countTag = t.messages.length > 1 ? ` ・ ${t.messages.length}件` : '';
    return `
      <div class="history-item" onclick="openHistoryDetail(${i})">
        <div class="main">
          <div class="subject">${escapeHtml(t.subject || '(件名なし)')}</div>
          <div class="preview">${escapeHtml(preview)}</div>
          <div class="meta"><span class="type-tag">${escapeHtml(t.type || '')}</span><span class="badge ${badgeClass}">${status}</span>${escapeHtml(last.ts || '')}${countTag}</div>
        </div>
        <div class="chevron">›</div>
      </div>`;
  }).join('');
}

function openHistoryDetail(index){
  const t = historyThreads[index];
  if(!t) return;
  renderThreadDetail(t);
  switchView(historyListView, historyDetailView, 'forward');
}

function renderThreadDetail(t){
  const blocks = t.messages.map(m => {
    let html = `
    <div class="detail-block">
      <div class="who">あなた${m.ts ? ' ・ ' + escapeHtml(m.ts) : ''}</div>
      <div class="body">${escapeHtml(m.content || '')}</div>
    </div>`;
    if(m.reply){
      html += `
    <div class="detail-block reply">
      <div class="who">運営からの返信</div>
      <div class="body">${escapeHtml(m.reply)}</div>
    </div>`;
    }
    return html;
  }).join('');

  historyDetailContent.innerHTML = `
    <div class="detail-subject">${escapeHtml(t.subject || '(件名なし)')}</div>
    <div class="detail-meta">${escapeHtml(t.type || '')}</div>
    ${blocks}
    <div class="follow-up">
      <textarea id="followUpText" maxlength="3000" placeholder="この件について続けて伝えたいことがあれば入力してください"></textarea>
      <button type="button" id="followUpBtn" class="submit">追加で送る</button>
    </div>
  `;

  document.getElementById('followUpBtn').addEventListener('click', () => sendFollowUp(t));
}

async function sendFollowUp(t){
  const textarea = document.getElementById('followUpText');
  const text = textarea.value.trim();
  if(!text) return;

  const btn = document.getElementById('followUpBtn');
  btn.disabled = true;
  btn.textContent = '送信中…';

  const data = {
    type: t.type,
    subject: t.subject,
    content: text,
    link: '',
    xid: '',
    threadCode: threadCode,
  };

  try{
    await fetch(WEBAPP_URL, { method: 'POST', body: JSON.stringify(data) });
  }catch(err){
    console.error(err);
  }

  await fetchThread();
  const updated = historyThreads.find(x => x.subject === t.subject);
  if(updated) renderThreadDetail(updated);
  showToast('送信しました');
}

function showHistoryList(instant){
  const reset = el => el.classList.remove('view-hidden','view-out-left','view-out-right','view-in-left','view-in-right');
  if(instant){
    historyDetailView.style.display = 'none';
    historyListView.style.display = '';
    reset(historyDetailView);
    reset(historyListView);
  } else {
    switchView(historyDetailView, historyListView, 'back');
  }
}

document.getElementById('backBtn').addEventListener('click', () => showHistoryList(false));

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- タブ切り替え ---------- */
const copy = {
  '情報提供': { subjectLabel:'件名', subjectPlaceholder:'', contentLabel:'詳細', contentPlaceholder:'', showLink:true },
  '掲載依頼': { subjectLabel:'掲載して欲しい楽曲', subjectPlaceholder:'曲名・アーティスト名など', contentLabel:'詳細', contentPlaceholder:'', showLink:false },
};

function applyType(type){
  currentType = type;
  tabs.forEach(t => t.setAttribute('aria-selected', t.dataset.type === type ? 'true' : 'false'));

  [subjectLabel, contentLabel].forEach(el => el.style.opacity = '0');
  linkField.classList.toggle('is-hidden', !copy[type].showLink);

  setTimeout(() => {
    subjectLabel.textContent = copy[type].subjectLabel;
    subjectInput.placeholder = copy[type].subjectPlaceholder;
    contentLabel.textContent = copy[type].contentLabel;
    contentInput.placeholder = copy[type].contentPlaceholder;
    subjectLabel.style.opacity = '1';
    contentLabel.style.opacity = '1';
  }, 120);
}

tabs.forEach(tab => tab.addEventListener('click', () => applyType(tab.dataset.type)));
applyType('情報提供');

/* ---------- 送信処理 ---------- */
form.addEventListener('submit', async (e) => {
  e.preventDefault();

  if (document.getElementById('website').value) return; // ハニーポット

  if (!form.checkValidity()){
    form.reportValidity();
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '送信中…';

  const data = {
    type: currentType,
    subject: document.getElementById('subject').value,
    content: document.getElementById('content').value,
    link: currentType === '情報提供' ? document.getElementById('link').value : '',
    xid: document.getElementById('xid').value,
    threadCode: threadCode,
  };

  try{
    // Content-Typeを指定しない(text/plain扱い)ことでCORSのプリフライトを回避しつつGAS側でJSONとして受け取る
    await fetch(WEBAPP_URL, {
      method: 'POST',
      body: JSON.stringify(data),
    });
  }catch(err){
    console.error(err);
  }

  switchView(form, done, 'forward');

  setTimeout(() => {
    switchView(done, form, 'back');
    form.reset();
    submitBtn.disabled = false;
    submitBtn.textContent = '送信する';
    applyType(currentType);
    fetchThread();
  }, 2700);
});

/* ---------- 初期表示 ---------- */
fetchThread();
</script>
</body>
</html>
